<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Workshop Pembangunan Website dengan WordPress</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div id="wrapper">
        <h1>Workshop Pembangunan Website dengan WordPress</h1>
        <form method="post" action="">
            <table cellspacing="4" cellpadding="4" border="1">
                <tr class="regrow">
                    <td style="width:32%;">Nama Lengkap Calon Peserta</td>
                    <td><input type="text" name="nama" size="30" /></td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Nomor Induk Mahasiswa (NIM)</td>
                    <td><input type="text" name="nim" size="30" /></td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Identitas Jenis Kelamin</td>
                    <td>
                        <input type="radio" id="lakilaki" name="jk" value="Laki-laki" />
                        <label for="lakilaki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Pilihan Program Studi</td>
                    <td>
                        <select name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
            </table>

            <table cellspacing="4" cellpadding="4" border="1">
                <tr class="regrow">
                    <td style="width:32%;">Kategori Status Peserta</td>
                    <td>
                        <input type="radio" id="mahasiswa" name="jenis_peserta" value="Mahasiswa" />
                        <label for="mahasiswa">Mahasiswa</label>
                        <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                        <label for="umum">Umum</label>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Pilihan Materi Workshop</td>
                    <td>
                        <input type="checkbox" id="uiux" name="materi" value="Pengenalan WordPress" />
                        <label for="uiux">Pengenalan WordPress sebagai salah satu Content Management System (CMS).</label><br />
                        <input type="checkbox" id="webdev" name="materi" value="MySQL" />
                        <label for="webdev">Penggunaan database MySQL</label><br />
                        <input type="checkbox" id="dataanalysis" name="materi" value="hosting" />
                        <label for="dataanalysis">Praktik hosting website</label>
                    </td>
                </tr>
            </table>

            <table cellspacing="4" cellpadding="4" border="1">
                <tr class="regrow">
                    <td style="width:32%;">Motivasi Mengikuti Kegiatan</td>
                    <td>
                        <textarea name="alasan" rows="8" cols="30"></textarea>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Metode Pembayaran</td>
                    <td>
                        <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                        <label for="qris">QRIS</label>
                        <input type="radio" id="transferbank" name="pembayaran" value="Transfer Bank" />
                        <label for="transferbank">Transfer Bank</label>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="width:32%;">Berkas Bukti Pembayaran</td>
                    <td>
                        <input type="file" name="bukti" />
                    </td>
                </tr>
                <tr class="regrow">
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="daftar" value="Kirim Formulir Pendaftaran" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
