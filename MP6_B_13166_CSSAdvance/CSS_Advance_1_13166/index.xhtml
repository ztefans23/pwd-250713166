<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Calon Anggota Marching Band UAJY</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div id="wrapper">
        <h1>Formulir Pendaftaran Calon Anggota Marching Band UAJY</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <table>
                <tr class="regrow">
                    <td>
                        <label for="nama"><strong>Nama Lengkap Anda</strong></label>
                    </td>
                    <td><input type="text" id="nama" name="nama" size="30" /></td>
                </tr>
                <tr class="regrow">
                    <td>
                        <label for="nim"><strong>Nomor Induk Mahasiswa (NIM)</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>
                <tr class="regrow">
                    <td>
                        <label for="prodi"><strong>Program Studi Akademik</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                            <option>Akuntansi</option>
                            <option>Manajemen</option>
                            <option>Teknik Pangan</option>
                        </select>
                    </td>
                </tr>
                <tr class="regrow">
                    <td><label for="email"><strong>Alamat Surat Elektronik (Email)</strong></label></td>
                    <td><input type="text" id="email" name="email" size="30" /></td>
                </tr>
                <tr class="regrow">
                    <td><label for="telepon"><strong>Nomor Kontak / Telepon</strong></label></td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30" />
                    </td>
                </tr>
                <tr class="regrow">
                    <td><strong>Identitas Jenis Kelamin</strong></td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                        <label for="laki">Laki-Laki</label>

                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr class="regrow">
                    <td>
                        <label for="semester"><strong>Semester Saat Ini</strong></label>
                    </td>
                    <td>
                        <select id="semester" name="semester">
                            <option>Semester 1</option>
                            <option>Semester 2</option>
                            <option>Semester 3</option>
                            <option>Semester 4</option>
                            <option>Semester 5</option>
                            <option>Semester 6</option>
                            <option>Semester 7</option>
                            <option>Semester 8</option>
                        </select>
                    </td>
                </tr>
                <tr class="regrow">
                    <td>
                        <strong>Pilihan Section Yang Diminati</strong>
                    </td>
                    <td>
                        <input type="radio" id="acara" name="divisi" value="Acara" />
                        <label for="acara">Brass</label>

                        <input type="radio" id="sdm" name="divisi" value="SDM" />
                        <label for="sdm">Color Guard</label>

                        <input type="radio" id="humas" name="divisi" value="Humas" />
                        <label for="humas">Battery</label>

                        <input type="radio" id="media" name="divisi" value="Media" />
                        <label for="media">Pit Instrumen</label>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="vertical-align:top;">
                        <strong>Pengalaman Serta Keahlian</strong>
                    </td>
                    <td>
                        <p>
                            <strong>Jenis Pengalaman Lomba</strong><br />
                            <input type="checkbox" id="PRHB X"
                                name="pengalaman"
                                value="PRHB X" />
                            <label for="kepanitiaan">PRHB X </label>

                            <input type="checkbox" id="JDCI"
                                name="pengalaman"
                                value="JDCI" />
                            <label for="organisasi">JDCI</label>

                            <input type="checkbox" id="IJMC"
                                name="pengalaman"
                                value="IJMC" />
                            <label for="volunteer">IJMC</label>
                        </p>
                        <p>
                            <strong>Kompetensi Diri</strong><br />
                            <input type="checkbox" id="Tempo"
                                name="kemampuan"
                                value="Tempo" />
                            <label for="publicspeaking">Perfect Tempo</label>

                            <input type="checkbox" id="Koreografi"
                                name="kemampuan"
                                value="Koreografi" />
                            <label for="desain">Koreografi</label>

                            <input type="checkbox" id="Pitch"
                                name="kemampuan"
                                value="Pitch" />
                            <label for="fotografi">Perfect Pitch</label>
                        </p>
                    </td>
                </tr>
                <tr class="regrow">
                    <td style="vertical-align:top;">
                        <label for="alasan"><strong>Motivasi Bergabung</strong></label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan"
                            rows="8" cols="30"></textarea>
                    </td>
                </tr>
                <tr class="regrow">
                    <td>
                        <label for="cv"><strong>Unggah Foto Diri</strong></label>
                    </td>
                    <td>
                        <input type="file" id="cv" name="cv"
                            accept="png/jpg" />
                    </td>
                </tr>
                <tr class="regrow">
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="daftar" value="Kirim Pendaftaran" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
